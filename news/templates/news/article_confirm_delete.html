{% extends 'base.html' %}
{% block title %}Delete Article{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Delete Article</h1>
  <p>Are you sure you want to delete <strong>"{{ article.title }}"</strong>?</p>
  <form method="post" style="display:flex;gap:.75rem;margin-top:1.5rem">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'news:article_detail' article.pk %}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
